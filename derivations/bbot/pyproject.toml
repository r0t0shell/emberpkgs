[project]
name = "bbot-wrapper"
version = "0.1.0"
requires-python = ">=3.10,<3.15"
dependencies = ["bbot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bbot_wrapper"]

[tool.uv.sources]
bbot = { git = "https://github.com/blacklanternsecurity/bbot", rev = "stable" }